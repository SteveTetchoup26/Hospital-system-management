# Construit les installateurs Linux (.deb) et Windows (.exe) et les attache à la release
# GitHub correspondant au tag poussé (ex. v1.0.0).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build installer
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew jpackage --no-daemon

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" build/jpackage/*.deb build/jpackage/*.exe --clobber 2>/dev/null \
            || gh release upload "$GITHUB_REF_NAME" $(ls build/jpackage/*.deb build/jpackage/*.exe 2>/dev/null) --clobber
